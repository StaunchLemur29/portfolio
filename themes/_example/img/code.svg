<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><rect width="800" height="500" fill="#1e1e2e"/><rect width="800" height="34" fill="#181825"/><circle cx="20" cy="17" r="6" fill="#f38ba8"/><circle cx="40" cy="17" r="6" fill="#f9e2af"/><circle cx="60" cy="17" r="6" fill="#a6e3a1"/><g font-family="monospace" font-size="20"><text x="30" y="80" fill="#cba6f7">def</text><text x="80" y="80" fill="#89b4fa">group_statements</text><text x="290" y="80" fill="#cdd6f4">(rows):</text><text x="70" y="115" fill="#cdd6f4">groups = {}</text><text x="70" y="150" fill="#cba6f7">for</text><text x="115" y="150" fill="#cdd6f4">row</text><text x="160" y="150" fill="#cba6f7">in</text><text x="190" y="150" fill="#cdd6f4">rows:</text><text x="110" y="185" fill="#cdd6f4">key = clean(row.desc)</text><text x="110" y="220" fill="#cdd6f4">groups.setdefault(key, []).append(row)</text><text x="70" y="255" fill="#cba6f7">return</text><text x="150" y="255" fill="#cdd6f4">groups</text><text x="30" y="320" fill="#6c7086"># 1,204 rows → 87 groups in 0.3s</text></g><rect x="30" y="360" width="740" height="110" rx="8" fill="#181825"/><text x="50" y="400" font-family="monospace" font-size="18" fill="#a6e3a1">✓ 42 tests passed</text></svg>