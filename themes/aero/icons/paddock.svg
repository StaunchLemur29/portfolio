<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Paddock (homelab): a small server with two drive bays and status lights -->
  <defs>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e959d"/>
      <stop offset="1" stop-color="#5a6169"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset=".5" stop-color="#d5dae0"/>
      <stop offset="1" stop-color="#aab2bb"/>
    </linearGradient>
    <linearGradient id="bay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3238"/>
      <stop offset="1" stop-color="#4a5159"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa451"/>
      <stop offset="1" stop-color="#e05d00"/>
    </linearGradient>
    <radialGradient id="led" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#eaffd9"/>
      <stop offset=".5" stop-color="#53d66b"/>
      <stop offset="1" stop-color="#1c8a33"/>
    </radialGradient>
  </defs>
  <ellipse cx="22" cy="45" rx="17" ry="2" fill="#000" opacity=".22"/>
  <!-- side panel -->
  <path d="M34 5l7 3v33l-7 3.5z" fill="url(#side)" stroke="#4a5058" stroke-width=".8" stroke-linejoin="round"/>
  <path d="M36 12l3 1.2M36 15l3 1.2M36 18l3 1.2" stroke="#3f454c" stroke-width=".8" opacity=".6"/>
  <!-- front -->
  <rect x="5" y="5" width="29" height="39.5" rx="2.5" fill="url(#front)" stroke="#6b737c" stroke-width=".8"/>
  <!-- badge -->
  <rect x="8.5" y="8.5" width="22" height="7" rx="1.5" fill="url(#badge)"/>
  <rect x="11" y="10.5" width="5" height="1.2" rx=".6" fill="#fff" opacity=".9"/>
  <rect x="11" y="12.6" width="5" height="1.2" rx=".6" fill="#fff" opacity=".9"/>
  <path d="M8.5 10a1.5 1.5 0 0 1 1.5-1.5h19a1.5 1.5 0 0 1 1.5 1.5v1.6c-7 1-15 1-22 0z" fill="#fff" opacity=".35"/>
  <!-- drive bays -->
  <rect x="8.5" y="19" width="22" height="6.5" rx="1" fill="url(#bay)"/>
  <rect x="10.5" y="21.3" width="12" height="1.8" rx=".9" fill="#7d868f"/>
  <circle cx="27.5" cy="22.2" r="1.4" fill="url(#led)"/>
  <rect x="8.5" y="28" width="22" height="6.5" rx="1" fill="url(#bay)"/>
  <rect x="10.5" y="30.3" width="12" height="1.8" rx=".9" fill="#7d868f"/>
  <circle cx="27.5" cy="31.2" r="1.4" fill="url(#led)"/>
  <!-- vents -->
  <path d="M10 38h19M10 40h19" stroke="#8a929b" stroke-width=".9" stroke-linecap="round"/>
  <!-- gloss -->
  <path d="M6 7.5a2 2 0 0 1 2-1.8h23a2 2 0 0 1 2 1.8C24 9 15 9 6 7.5z" fill="#fff" opacity=".8"/>
</svg>
